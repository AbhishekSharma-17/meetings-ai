name: Product API

on:
  push:
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "packages/contracts/**"
      - ".github/workflows/api.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements.txt
      - name: API and migration tests (no live integrations)
        env:
          PYTHONPATH: packages/contracts:services/api
        run: python -m pytest services/api/tests -q
