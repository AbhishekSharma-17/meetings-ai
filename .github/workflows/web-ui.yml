name: Web UI

on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ui.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ui.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:design
      - run: npm run typecheck
      - run: npm run test:contrast
      - run: npm run test:css-comments
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke render public routes
        run: |
          npm start -- --port 3020 &
          npm run test:smoke
