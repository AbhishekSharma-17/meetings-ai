name: meetings-ai

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: development
      WEB_ORIGIN: http://localhost:3020
      DATABASE_URL: postgresql+psycopg://meetings_ai:meetings_ai_local_only@postgres:5432/meetings_ai
      # Local development fallback only. Set a stable private key before storing real credentials.
      PROVIDER_CREDENTIAL_KEY: ${PROVIDER_CREDENTIAL_KEY:-development-only-change-me}
      VEXA_BASE_URL: http://vexa-lite:8056
      VEXA_API_KEY: ${VEXA_API_KEY:-}
      VEXA_STT_OVERRIDE_SECRET: ${VEXA_STT_OVERRIDE_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Meetings AI}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3020}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_GOOGLE_CALENDAR_AUTH_CONFIG_ID: ${COMPOSIO_GOOGLE_CALENDAR_AUTH_CONFIG_ID:-}
      COMPOSIO_OUTLOOK_AUTH_CONFIG_ID: ${COMPOSIO_OUTLOOK_AUTH_CONFIG_ID:-}
      COMPOSIO_CALENDLY_AUTH_CONFIG_ID: ${COMPOSIO_CALENDLY_AUTH_CONFIG_ID:-}
      COMPOSIO_ZOOM_AUTH_CONFIG_ID: ${COMPOSIO_ZOOM_AUTH_CONFIG_ID:-}
      COMPOSIO_GOOGLE_CALENDAR_VERSION: ${COMPOSIO_GOOGLE_CALENDAR_VERSION:-20260915_00}
      COMPOSIO_OUTLOOK_VERSION: ${COMPOSIO_OUTLOOK_VERSION:-20260922_00}
      COMPOSIO_CALENDLY_VERSION: ${COMPOSIO_CALENDLY_VERSION:-20260915_00}
      COMPOSIO_ZOOM_VERSION: ${COMPOSIO_ZOOM_VERSION:-20260903_00}
      AUTO_CALENDAR_SCHEDULE_ENABLED: ${AUTO_CALENDAR_SCHEDULE_ENABLED:-1}
      AUTO_MOM_ENABLED: ${AUTO_MOM_ENABLED:-1}
      AUTO_KNOWLEDGE_INDEX_ENABLED: ${AUTO_KNOWLEDGE_INDEX_ENABLED:-1}
      AUTO_RETENTION_ENABLED: ${AUTO_RETENTION_ENABLED:-1}
      MEETINGS_AI_ADMIN_PASSWORD: ${MEETINGS_AI_ADMIN_PASSWORD:-}
      MEETINGS_AI_SESSION_SECRET: ${MEETINGS_AI_SESSION_SECRET:-}
    ports:
      - "127.0.0.1:8320:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - default
      - vexa
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: meetings_ai
      POSTGRES_USER: meetings_ai
      POSTGRES_PASSWORD: meetings_ai_local_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - meetings-ai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings_ai -d meetings_ai"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    profiles: ["foundation"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: meetings-ai-local
      MINIO_ROOT_PASSWORD: meetings-ai-local-secret
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - meetings-ai-minio:/data

volumes:
  meetings-ai-postgres:
  meetings-ai-minio:

networks:
  vexa:
    name: vexa-lite-net
    external: true
